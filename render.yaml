# Render Blueprint —— 在 dashboard.render.com/blueprints 里连上这个仓库就会自动创建服务
#
# 注意：免费实例的磁盘不持久，重新部署 / 重启之后 /data 会清空，
# 也就是说任务、卡片、专注记录都会丢。想长期用请换 Fly.io 的卷（见 fly.toml）
# 或者升级到带 Disk 的付费计划，再把 disk 段加上。
services:
  - type: web
    name: study-workbench
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      # PORT 不用写，Render 会注入，应用读 process.env.PORT
